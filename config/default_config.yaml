paths:
  raw_dir: data/raw
  output_dir: outputs
  blocks_json: data/raw/geisinger-users_blocks.json
  providers_json: data/raw/geisinger-users_providers.json
  cases_json: data/raw/geisinger-users_cases.json

pre_layer:
  template_weeks: 0
  max_candidate_period: 13
  canonical_time_margin_minutes: 120
  round_time_minutes: 5

layer1:
  n_scenarios: 200
  random_seed: 42
  proxy_case_utilization: 0.62
  proxy_turnover_fraction: 0.08
  min_history_rows_for_model: 30
  target_lookback_weeks: 12

layer2:
  use_epsilon_bounds: false
  mip_retry_block_caps: [ 250, 150, 100, 60 ]
  mip_time_limit_s: 60
  coverage_alpha: 0.85
  default_target_utilization: 0.70
  optimization_weeks: 13
  max_active_providers: 35
  max_template_blocks_for_mip: 250
  use_ortools_if_available: false
  solver_time_limit_seconds: 60

layer3:
  top_k_features: 10
  counterfactual_targets: [0.60, 0.70, 0.80]
